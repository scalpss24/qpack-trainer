name: Test & Build Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  test-converter:
    name: Run Python Converter Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  build-apk:
    name: Build Android Debug APK
    needs: test-converter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Capacitor dependencies
        run: npm install

      - name: Generate Android project and sync web assets
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK for download
        run: cp android/app/build/outputs/apk/debug/app-debug.apk qpack-trainer-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: qpack-trainer-debug-apk
          path: qpack-trainer-debug.apk
          retention-days: 30
